name: Publicar .exe

# Se publica una versión al subir una etiqueta:  git tag v0.1.0  &&  git push origin v0.1.0
# También se puede correr a mano (pestaña Actions > Publicar .exe > Run workflow): solo deja el .exe
# como artefacto descargable, sin crear un Release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write          # para crear el Release y subir el .exe

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt -r requirements-dev.txt "pyinstaller>=6.10,<7"

      - name: La etiqueta coincide con la versión de pyproject.toml
        if: startsWith(github.ref, 'refs/tags/')
        shell: python
        run: |
          import os, tomllib
          version = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          tag = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          assert tag == version, f"La etiqueta v{tag} no coincide con la versión {version} de pyproject.toml"

      - name: Pruebas
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest

      - name: Compilar MiniSQL.exe
        run: pyinstaller packaging/MiniSQL.spec --noconfirm

      - name: Autoprueba del .exe (Qt, Oracle thin, criptografía, llavero)
        shell: pwsh
        run: |
          # Es una app de ventana: PowerShell no la espera si no se usa Start-Process -Wait
          $p = Start-Process -FilePath dist\MiniSQL.exe -ArgumentList "--self-test" -Wait -PassThru
          Get-Content dist\selftest.log
          if ($p.ExitCode -ne 0) { throw "La autoprueba del .exe falló (código $($p.ExitCode))" }
          Remove-Item dist\selftest.log

      - name: Guardar el .exe como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: MiniSQL-${{ github.ref_name }}
          path: dist/MiniSQL.exe
          if-no-files-found: error

      - name: Publicar en Releases
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MiniSQL.exe
          generate_release_notes: true
