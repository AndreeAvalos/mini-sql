name: Publicar .exe

# Se publica una versión al subir una etiqueta igual a __version__ de minisql/__init__.py:
#     git tag v0.2.0  &&  git push origin v0.2.0
# La app instalada la detecta sola (ver minisql/update.py).
# También se puede correr a mano (pestaña Actions > Publicar .exe > Run workflow): solo deja el .exe
# como artefacto descargable, sin crear un Release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write          # para crear el Release y subir el .exe

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt -r requirements-dev.txt "pyinstaller>=6.10,<7"

      - name: La etiqueta coincide con la versión de minisql/__init__.py
        if: startsWith(github.ref, 'refs/tags/')
        shell: python
        run: |
          import os, re
          text = open("minisql/__init__.py", encoding="utf-8").read()
          version = re.search(r'__version__\s*=\s*"([^"]+)"', text).group(1)
          tag = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          assert tag == version, f"La etiqueta v{tag} no coincide con __version__ = {version} de minisql/__init__.py"

      - name: Pruebas
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest

      - name: Compilar MiniSQL.exe
        run: pyinstaller packaging/MiniSQL.spec --noconfirm

      - name: Autoprueba del .exe (Qt, Oracle thin, criptografía, llavero)
        shell: pwsh
        run: |
          # Es una app de ventana: PowerShell no la espera si no se usa Start-Process -Wait
          $p = Start-Process -FilePath dist\MiniSQL.exe -ArgumentList "--self-test" -Wait -PassThru
          Get-Content dist\selftest.log
          if ($p.ExitCode -ne 0) { throw "La autoprueba del .exe falló (código $($p.ExitCode))" }
          Remove-Item dist\selftest.log

      - name: Huella SHA-256 (el actualizador no instala nada sin verificarla)
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist\MiniSQL.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  MiniSQL.exe" | Out-File dist\MiniSQL.exe.sha256 -Encoding ascii -NoNewline
          Get-Content dist\MiniSQL.exe.sha256

      - name: Guardar el .exe como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: MiniSQL-${{ github.ref_name }}
          path: |
            dist/MiniSQL.exe
            dist/MiniSQL.exe.sha256
          if-no-files-found: error

      - name: Publicar en Releases
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/MiniSQL.exe
            dist/MiniSQL.exe.sha256
          generate_release_notes: true
          # v0.3.0-beta.1 → versión de prueba: solo la reciben quienes activan "Incluir versiones de prueba"
          prerelease: ${{ contains(github.ref_name, '-') }}
