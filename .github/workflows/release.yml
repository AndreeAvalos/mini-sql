name: Publicar .exe

# Se publica una versión de tres maneras:
#   1. Subiendo una etiqueta igual a __version__ de minisql/__init__.py:  git tag v0.2.0 && git push origin v0.2.0
#   2. Con un commit a main que diga [CI], [CI minor] o [CI major]: version.yml sube la versión, crea la
#      etiqueta y llama a este workflow (workflow_call).
#   3. A mano (Actions > Publicar .exe > Run workflow): solo deja el .exe como artefacto, sin Release.
# La app instalada detecta la versión nueva sola (ver minisql/update.py).
on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      tag:
        description: Etiqueta a publicar (vX.Y.Z); el Release la crea en el commit `ref`
        required: true
        type: string
      ref:
        description: Commit a compilar y etiquetar
        required: true
        type: string
  workflow_dispatch:

permissions:
  contents: write          # para crear el Release y subir el .exe

jobs:
  windows-exe:
    runs-on: windows-latest
    env:
      # La etiqueta a publicar: la que llega de version.yml o la que se subió. Vacía = solo artefacto.
      TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name || '') }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}      # llamado desde version.yml: el commit de la versión nueva
          fetch-depth: 0                             # notas del release: los commits desde la etiqueta anterior

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt -r requirements-dev.txt "pyinstaller>=6.10,<7"

      - name: La etiqueta coincide con la versión de minisql/__init__.py
        if: env.TAG != ''
        shell: python
        run: |
          import os, re
          text = open("minisql/__init__.py", encoding="utf-8").read()
          version = re.search(r'__version__\s*=\s*"([^"]+)"', text).group(1)
          tag = os.environ["TAG"].removeprefix("v")
          assert tag == version, f"La etiqueta v{tag} no coincide con __version__ = {version} de minisql/__init__.py"

      - name: Pruebas
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest

      - name: Compilar MiniSQL.exe
        run: pyinstaller packaging/MiniSQL.spec --noconfirm

      - name: Autoprueba del .exe (Qt, Oracle thin, criptografía, llavero)
        shell: pwsh
        run: |
          # Es una app de ventana: PowerShell no la espera si no se usa Start-Process -Wait
          $p = Start-Process -FilePath dist\MiniSQL.exe -ArgumentList "--self-test" -Wait -PassThru
          Get-Content dist\selftest.log
          if ($p.ExitCode -ne 0) { throw "La autoprueba del .exe falló (código $($p.ExitCode))" }
          Remove-Item dist\selftest.log

      - name: Huella SHA-256 (el actualizador no instala nada sin verificarla)
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist\MiniSQL.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  MiniSQL.exe" | Out-File dist\MiniSQL.exe.sha256 -Encoding ascii -NoNewline
          Get-Content dist\MiniSQL.exe.sha256

      - name: Guardar el .exe como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: MiniSQL-${{ env.TAG || github.ref_name }}
          path: |
            dist/MiniSQL.exe
            dist/MiniSQL.exe.sha256
          if-no-files-found: error

      - name: Notas de la versión (los commits desde la versión anterior; la app las muestra en "Novedades")
        if: env.TAG != ''
        run: python packaging/release_notes.py "${{ inputs.ref || github.sha }}" dist/notas.md

      - name: Publicar en Releases
        if: env.TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          body_path: dist/notas.md
          target_commitish: ${{ inputs.ref || github.sha }}   # la etiqueta nueva apunta al commit compilado
          files: |
            dist/MiniSQL.exe
            dist/MiniSQL.exe.sha256
          generate_release_notes: true
          # v0.3.0-beta.1 → versión de prueba: solo la reciben quienes activan "Incluir versiones de prueba"
          prerelease: ${{ contains(env.TAG, '-') }}
